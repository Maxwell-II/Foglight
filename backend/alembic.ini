[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# NOTE: keep this file ASCII-only. Alembic reads it with configparser using the
# system locale encoding (GBK on this Windows box), so non-ASCII comments raise
# UnicodeDecodeError. Chinese notes belong in alembic/env.py instead.
#
# The connection string is resolved in alembic/env.py from app.config so that
# local and production share one source of truth. Leave this blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
