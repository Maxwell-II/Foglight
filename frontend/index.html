<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>短阅读标记器 · Phase 0</title>
    <!-- ⚠️ 上线前要把这三款打包成 woff2 自托管（Noto Sans SC 必须子集化）：
         国内直连 fonts.googleapis.com 不稳，转圈时整页会先用回落字体闪一下。
         三款都是 OFL，可自行分发。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;1,300&family=Noto+Sans+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>try{var t=localStorage.getItem('reading.theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
